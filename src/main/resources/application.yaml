ktor:
  application:
    modules:
      - com.dw.ApplicationKt.module
  deployment:
    port: 8080
  jwt:
    secret: ${JWT_SECRET:secret}
    issuer: ${JWT_ISSUER:issuer}
    audience: ${JWT_AUDIENCE:**}
    realm: ${JWT_REALM:access to the librax api}
    signatureAlgorithm: "HS256"
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
    email: ${ADMIN_EMAIL:admin@example.com}
  swagger:
    path: ${SWAGGER_PATH:/docs}
    username: ${SWAGGER_USERNAME:swagger}
    password: ${SWAGGER_PASSWORD:swagger}
    openapi:
      file: ${SWAGGER_OPENAPI:openapi/documentation.yaml}
  psql-database:
    url: ${DB_URL:jdbc:postgresql://localhost:5423/librax}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:mysecretpassword}
    driver: ${DB_DRIVER:org.postgresql.Driver}
  export:
    directory: ${EXPORT_DIRECTORY:exports}
    retentionHours: ${EXPORT_RETENTION_HOURS:24}

kind: Application